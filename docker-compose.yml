services:
  psacc:
    image: ghcr.io/ricardo-duarte-av/psa_car_controller:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
    # environment:
      # configuration directory, it's the volume mounted above
      # - PSACC_CONFIG_DIR=/config
      # port psacc listens on, change the ports mapping above too
      # - PSACC_PORT=5000
      # base path of the web app, useful behind a reverse proxy serving psacc on a sub path
      # - PSACC_BASE_PATH=/
      # cli arguments given to psa-car-controller:
      #   -c [file]  enable charge control (default charge_config.json)
      #   -r         record vehicle data in the database (needed by the dashboard)
      #   --web-conf configure psacc from the web page instead of the console
      #   -d [level] debug level, 10 is debug, 20 is info
      #   -R <min>   refresh the vehicle status every <min> minutes
      #   --remote-disable  disable remote control (no mqtt)
      #   --offline  offline limited mode
      # - PSACC_OPTIONS=-c -r --web-conf
      # set to 1 to log the mqtt client, useful to debug remote control
      # - MQTT_LOG=0
      # set to any value to show the browser during the first authentication, it's headless by default
      # - NO_HEADLESS=
      # timezone of the container, charge hours and trips use the local time
      # - TZ=Europe/Lisbon
