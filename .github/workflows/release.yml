name: Publish Docker image and pypi package
on:
  push:
    tags:
     - 'v*.*.*'
  workflow_dispatch:
jobs:
  create_release:
    name: Push to pypi
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v6
     - name: Set up Python
       uses: actions/setup-python@v6
       with:
        python-version: '3.11'
     - name: Install dependencies
       run: |
         python -m pip install --upgrade pip
         pip install poetry
         sudo apt-get install libblas3 liblapack3 liblapack-dev libblas-dev gfortran libatlas-base-dev
     - name: Build wheel
       run: |
         PSACC_VERSION=$(git describe --tags --abbrev=0)
         echo "PSACC_VERSION=${PSACC_VERSION}" >> $GITHUB_ENV
         poetry version ${PSACC_VERSION}
         poetry build
     - name: Publish to pypi
       # a fork has no pypi token, the docker image is still built and published
       # the secrets context isn't available in if, it has to go through env
       env:
         PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
       if: ${{ env.PYPI_TOKEN != '' }}
       run: poetry publish --username __token__ --password "${PYPI_TOKEN}"
     - name: Rename the wheel for the docker build
       run: mv dist/psa_car_controller-${PSACC_VERSION:1}-py3-none-any.whl dist/psa_car_controller-0.0.0-py3-none-any.whl
     - uses: actions/upload-artifact@v4
       with:
         name: wheel-package
         path: dist/psa_car_controller-0.0.0-py3-none-any.whl
  build_image:
    needs: create_release
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # each platform builds on its own runner, the arm images aren't built for now.
          # arm64 builds natively on ubuntu-24.04-arm, arm/v7 needs docker/setup-qemu-action
          - platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          PLATFORM=${{ matrix.platform }}
          echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-package
          path: dist
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the image is pushed without a tag, the push_to_registry job tags the multi platform image
      - name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # the layers are cached between releases, one cache per platform
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,scope=${{ env.PLATFORM_SLUG }},mode=max
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push_to_registry:
    needs: build_image
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # the psacc-ha repository can only be updated with the token of its owner
      has_gh_pat: ${{ secrets.GH_PAT != '' }}
    steps:
      - name: Prepare
        id: prep
        env:
          # docker hub is only used when the credentials are configured, ghcr is always used
          DOCKER_HUB_IMAGE: ${{ secrets.DOCKER_USERNAME != '' && 'flobz/psa_car_controller' || '' }}
        run: |
          GHCR_IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=${GHCR_IMAGE}" >> $GITHUB_ENV
          IMAGES="${GHCR_IMAGE}"
          if [[ -n "${DOCKER_HUB_IMAGE}" ]]; then
            IMAGES="${IMAGES} ${DOCKER_HUB_IMAGE}"
          fi
          VERSION=edge
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            MINOR_VERSION=${VERSION%.*}
            MAJOR=${MINOR_VERSION%.*}
            VERSION_TAGS="${VERSION} ${MINOR_VERSION} ${MAJOR} latest"
          else
            VERSION_TAGS="${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          TAGS=""
          for image in ${IMAGES}; do
            for tag in ${VERSION_TAGS}; do
              TAGS="${TAGS} -t ${image}:${tag}"
            done
          done
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "push_to_docker_hub=${DOCKER_HUB_IMAGE:+true}" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        if: steps.prep.outputs.push_to_docker_hub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push the multi platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.prep.outputs.tags }} \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)
      - name: Inspect image
        run: docker buildx imagetools inspect ${GHCR_IMAGE}:${VERSION}

  update_ha_config:
    needs: push_to_registry
    name: Update psacc-ha version
    runs-on: ubuntu-latest
    if: needs.push_to_registry.outputs.has_gh_pat == 'true' && github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'b')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/update-ha-config
        with:
          gh_token: ${{ secrets.GH_PAT }}
          version: ${{ github.ref_name }}
          branch: 'main'
          message: "chore: bump version to ${{ github.ref_name }}"

  update_ha_config_beta:
    needs: push_to_registry
    name: Update psacc-ha beta version
    runs-on: ubuntu-latest
    if: needs.push_to_registry.outputs.has_gh_pat == 'true' && github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'b')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/update-ha-config
        with:
          gh_token: ${{ secrets.GH_PAT }}
          version: ${{ github.ref_name }}
          branch: 'beta'
          message: "chore: bump beta version to ${{ github.ref_name }}"
